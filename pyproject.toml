[project]
name = "streamlit"
version = "1.0"
description = "Simulation diverser Patient*innen-Populationen mit Fallvignetten und Large Language Models"
authors = [
    {name = "Daniel Reichenpfader", email = "daniel.reichenpfader@bfh.ch"},
]
dependencies = [
    "openai>=1.12.0",
    "python-dotenv==1.0.0",
    "streamlit>=1.41.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.scripts]
run-app = {cmd= "streamlit run ./src/streamlit/Chat.py"}
